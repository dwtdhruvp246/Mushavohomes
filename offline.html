<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#047857">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <title>Offline | Mushavo Homes</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #ecfdf5;
      color: #0f172a;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 1rem;
      background:
        radial-gradient(circle at top left, rgba(45, 212, 191, 0.18), transparent 42%),
        linear-gradient(145deg, #ecfdf5, #f8fafc 65%, #ecfeff);
    }

    main {
      width: min(100%, 28rem);
      padding: clamp(1.5rem, 6vw, 2.5rem);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 1.25rem;
      background: rgba(255, 255, 255, 0.82);
      box-shadow: 0 24px 64px rgba(15, 23, 42, 0.12);
      text-align: center;
    }

    img {
      display: block;
      width: auto;
      height: 7rem;
      max-width: 100%;
      margin: 0 auto 1rem;
      object-fit: contain;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.5rem, 6vw, 2rem);
      line-height: 1.2;
    }

    p {
      margin: 0.85rem 0 0;
      color: #475569;
      font-size: 0.95rem;
      line-height: 1.65;
    }

    button {
      width: 100%;
      min-height: 2.75rem;
      margin-top: 1.5rem;
      padding: 0.75rem 1rem;
      border: 0;
      border-radius: 0.75rem;
      background: #059669;
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:focus-visible {
      outline: 3px solid rgba(5, 150, 105, 0.3);
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <img src="/mushavo-logo.png" alt="Mushavo Homes logo">
    <h1>You're offline</h1>
    <p>Mushavo Homes needs an internet connection to securely load current account information. No protected client data is stored on this offline screen.</p>
    <button type="button" onclick="window.location.reload()">Try again</button>
  </main>
</body>
</html>
